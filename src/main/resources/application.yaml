spring:
  application:
    name: judicial-pipeline

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

datajud:
  url: https://api-publica.datajud.cnj.jus.br/api_publica_tjsp/_search
  api-key: ${DATAJUD_API_KEY}

descoberta:
  sublime:
    atraso-inicial-ms: 120000
    intervalo-ms: 21600000
