spring:
  application:
    name: judicial-pipeline

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

app:
  security:
    enabled: ${APP_SECURITY_ENABLED:false}
    username: ${APP_SECURITY_USERNAME:}
    password: ${APP_SECURITY_PASSWORD:}

datajud:
  url: https://api-publica.datajud.cnj.jus.br/api_publica_tjsp/_search
  api-key: ${DATAJUD_API_KEY}

descoberta:
  atraso-inicial-ms: 120000
  intervalo-ms: 21600000

ciclo-vida:
  atraso-inicial-ms: 10000
  intervalo-ms: 60000

integracao:
  fontes:
    timeout-ms: 15000
    max-tentativas: 3
    espera-inicial-ms: 400
  djen:
    janela-dias: 45
    max-paginas: 2
