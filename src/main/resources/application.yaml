spring:
  application:
    name: judicial-pipeline

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

    datajud:
      url: https://api-publica.datajud.cnj.jus.br/api_publica_tjsp/_search
      api-key: ${DATAJUD_API_KEY}