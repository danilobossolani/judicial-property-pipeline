name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify with Maven
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload application package
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: judicial-pipeline
          path: target/*.jar
          if-no-files-found: error
          retention-days: 14

  validate-windows-installer:
    name: Validate Windows installer
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build installer with CI-only test key
        shell: pwsh
        run: ./installer/build-installer.ps1 -DataJudApiKey "ci-structural-test-key"

      - name: Validate embedded payload and checksum
        shell: pwsh
        run: |
          $installer = Resolve-Path "dist/Judicial-Pipeline-Instalador.exe"
          $process = Start-Process -FilePath $installer -ArgumentList "--validate" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "O payload do instalador é inválido. Código: $($process.ExitCode)."
          }

          $expected = (Get-Content "$installer.sha256.txt").Split(" ")[0]
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          if ($actual -ne $expected) {
            throw "O checksum do instalador não confere."
          }
