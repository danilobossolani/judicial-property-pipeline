services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-judicial_pipeline}
      POSTGRES_USER: ${POSTGRES_USER:-judicial_pipeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      TZ: America/Sao_Paulo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-judicial_pipeline}
      DB_USER: ${POSTGRES_USER:-judicial_pipeline}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      DATAJUD_API_KEY: ${DATAJUD_API_KEY:?Defina DATAJUD_API_KEY no arquivo .env}
      APP_SECURITY_ENABLED: ${APP_SECURITY_ENABLED:-true}
      APP_SECURITY_USERNAME: ${APP_SECURITY_USERNAME:?Defina APP_SECURITY_USERNAME no arquivo .env}
      APP_SECURITY_PASSWORD: ${APP_SECURITY_PASSWORD:?Defina APP_SECURITY_PASSWORD no arquivo .env}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"

volumes:
  postgres-data:
